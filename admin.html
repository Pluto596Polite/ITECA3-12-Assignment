<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - C2C Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="admin.html"><i class="fas fa-shield-alt"></i> Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-home"></i> Back to Site
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 bg-light sidebar py-4">
                <div class="list-group">
                    <button class="list-group-item list-group-item-action active" data-bs-toggle="tab" data-bs-target="#dashboard">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </button>
                    <button class="list-group-item list-group-item-action" data-bs-toggle="tab" data-bs-target="#users">
                        <i class="fas fa-users"></i> Users
                    </button>
                    <button class="list-group-item list-group-item-action" data-bs-toggle="tab" data-bs-target="#products">
                        <i class="fas fa-box"></i> Products
                    </button>
                    <button class="list-group-item list-group-item-action" data-bs-toggle="tab" data-bs-target="#orders">
                        <i class="fas fa-shopping-cart"></i> Orders
                    </button>
                    <button class="list-group-item list-group-item-action" data-bs-toggle="tab" data-bs-target="#pending">
                        <i class="fas fa-clock"></i> Pending Approval
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 py-4">
                <div class="tab-content">
                    <!-- Dashboard Tab -->
                    <div class="tab-pane fade show active" id="dashboard">
                        <h2 class="mb-4">Dashboard Overview</h2>
                        <div class="row" id="statsCards">
                            <!-- Stats cards will be loaded here -->
                        </div>
                        
                        <div class="row mt-4">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header bg-primary text-white">
                                        <h5 class="mb-0">Recent Activity</h5>
                                    </div>
                                    <div class="card-body">
                                        <p class="text-muted">Latest platform activities will appear here</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header bg-success text-white">
                                        <h5 class="mb-0">Quick Actions</h5>
                                    </div>
                                    <div class="card-body">
                                        <button class="btn btn-outline-primary mb-2 w-100" data-bs-toggle="tab" data-bs-target="#pending">
                                            <i class="fas fa-check"></i> Review Pending Products
                                        </button>
                                        <button class="btn btn-outline-success w-100" data-bs-toggle="tab" data-bs-target="#users">
                                            <i class="fas fa-users"></i> Manage Users
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Users Tab -->
                    <div class="tab-pane fade" id="users">
                        <h2 class="mb-4">User Management</h2>
                        <div class="card">
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Name</th>
                                                <th>Email</th>
                                                <th>Role</th>
                                                <th>Joined</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="usersTable">
                                            <!-- Users will be loaded here -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Products Tab -->
                    <div class="tab-pane fade" id="products">
                        <h2 class="mb-4">All Products</h2>
                        <div class="mb-3">
                            <button class="btn btn-primary" onclick="loadAllProducts('active')">Active</button>
                            <button class="btn btn-secondary" onclick="loadAllProducts('pending')">Pending</button>
                            <button class="btn btn-success" onclick="loadAllProducts('sold')">Sold</button>
                            <button class="btn btn-danger" onclick="loadAllProducts('rejected')">Rejected</button>
                        </div>
                        <div class="row" id="allProductsGrid">
                            <!-- Products will be loaded here -->
                        </div>
                    </div>

                    <!-- Orders Tab -->
                    <div class="tab-pane fade" id="orders">
                        <h2 class="mb-4">All Orders</h2>
                        <div class="card">
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>Order ID</th>
                                                <th>Product</th>
                                                <th>Buyer</th>
                                                <th>Seller</th>
                                                <th>Amount</th>
                                                <th>Status</th>
                                                <th>Date</th>
                                            </tr>
                                        </thead>
                                        <tbody id="ordersTable">
                                            <!-- Orders will be loaded here -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pending Approval Tab -->
                    <div class="tab-pane fade" id="pending">
                        <h2 class="mb-4">Pending Product Approvals</h2>
                        <div class="row" id="pendingProducts">
                            <!-- Pending products will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
