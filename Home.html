<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextDoorSA</title>

    <!--this is a new comment that I made to be cool-->

    <!-- 1. Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 2. Optimized Google Fonts Import (minimal subset) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- 3. Bootstrap 5 CSS (lean option) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 4. Fixed Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- 5. Your Custom Files (Keep these last) -->
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="./app.js"></script>
    <!-- <script defer src="./component.js"></script> -->
  </head>




  <body>
  <!--#TODO: write logic so that the input field that is used to search for items is able to read the description of listings and display them-->

  <app-navbar></app-navbar>

    <section class="hero-section">
      <h1 class="hero-title">Welcome to NextDoorSA</h1>
      <p class="hero-subtitle">Find amazing deals right in your neighbourhood.</p>
      <div class="input-group hero-search">
        <input
                type="text"
                class="form-control"
                placeholder="Search for items, brands, or categories..."
                aria-label="Search"
        />
        <button class="btn btn-primary" type="button" id="search-button">
          <i class="bi bi-search"></i> Search
        </button>
      </div>
    </section>

    <main class="container pb-5">
      <!-- Categories Section -->
      <div class="section-header">
        <h2 class="section-title">Shop by Category</h2>
        <a href="explore.html" class="section-link">View All</a>
      </div>

      <div class="category-scroll-container mb-5">
        <div class="category-card" onclick="outdoorCategoryButton()">
          <div class="category-icon">
            <i class="bi bi-tree"></i>
          </div>
          <span class="category-name">Outdoors</span>
        </div>
        <div class="category-card" onclick="electronicsCategoryButton()">
          <div class="category-icon">
            <i class="bi bi-pc-display"></i>
          </div>
          <span class="category-name">Electronics</span>
        </div>
        <div class="category-card" onclick="homeCategoryButton()">
          <div class="category-icon">
            <i class="bi bi-house"></i>
          </div>
          <span class="category-name">Home</span>
        </div>
        <div class="category-card" onclick="furnitureCategoryButton()">
          <div class="category-icon">
            <img src="Assets/blueCouch.svg" alt="furniture" width="24" height="24" />
          </div>
          <span class="category-name">Furniture</span>
        </div>
        <div class="category-card" onclick="servicesCategoryButton()">
          <div class="category-icon">
            <i class="bi bi-person-circle"></i>
          </div>
          <span class="category-name">Services</span>
        </div>
        <div class="category-card" onclick="sportsCategoryButton()">
          <div class="category-icon">
            <i class="bi bi-bicycle"></i>
          </div>
          <span class="category-name">Sports</span>
        </div>
      </div>

      <!-- Featured Items Section -->
      <div class="section-header">
        <h2 class="section-title">Trending in Your Area</h2>
        <a href="explore.html" class="section-link">View More</a>
      </div>

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col">
          <product-card
                  title="Mechanical Keyboard"
                  image="Assets/keyboard.jpeg"
                  description="High quality mechanical keyboard with RGB backlighting."
                  price="1200"
                  link="#"
          ></product-card>
        </div>
        <div class="col">
          <product-card
                  title="Men's Shirt"
                  image="Assets/men's shirt.jpeg"
                  description="Cotton men's shirt, size L. Barely worn."
                  price="1200"
                  link="#"
          ></product-card>
        </div>
        <div class="col">
          <product-card
                  title="Kitchen Blender"
                  image="Assets/appliance.jpeg"
                  description="Powerful kitchen blender, perfect for smoothies."
                  price="1200"
                  link="#"
          ></product-card>
        </div>
        <div class="col">
          <product-card
                  title="Living Room Sofa"
                  image="Assets/furniture.jpeg"
                  description="Comfortable 3-seater sofa. Grey upholstery."
                  price="1200"
                  link="#"
          ></product-card>
        </div>
      </div>

    </main>

    <!-- Product Details Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalLabel">Product Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <img id="modalImage" src="" class="img-fluid mb-3 rounded" alt="Product Image" style="width: 100%; max-height: 300px; object-fit: cover;">
            <h4 id="modalTitle" class="mb-2"></h4>
            <h5 id="modalPrice" class="text-primary fw-bold mb-3"></h5>
            <p id="modalDescription" class="text-muted"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <a href="#" id="modalLink" class="btn btn-primary">View Full Listing</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Event listener for the custom 'view-details' event from product-card components
      document.addEventListener('view-details', (e) => {
        const { title, image, description, link, price } = e.detail;

        // Populate modal with product details
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalPrice').textContent = "R " + price;
        document.getElementById('modalImage').src = image;
        document.getElementById('modalImage').alt = title;
        document.getElementById('modalDescription').textContent = description;
        document.getElementById('modalLink').href = link;

        // Show the modal using Bootstrap API
        const productModal = new bootstrap.Modal(document.getElementById('productModal'));
        productModal.show();
      });

      const homeCategoryButton = () => {
        //this is the function that will be triggered when the category buttons on the home page is pressed
        alert("The home category button is clicked!")
      }


      const outdoorCategoryButton = () => {
        alert("The outdoor category button has been clicked!")
      }

      const electronicsCategoryButton = () => {
        alert("The electron category button has been clicked!")
      }

      const servicesCategoryButton = () => {
        alert("The services button has been clicked!")
      }

      const sportsCategoryButton = () => {
        alert("The sport category button has been clicked!")
      }

      const furnitureCategoryButton = () => {
        alert("The furniture category button has been clicked!")
      }
    </script>

  </body>
</html>
