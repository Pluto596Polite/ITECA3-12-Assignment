<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NextDoorSA</title>
    
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <!-- Bootstrap Icons CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css" />
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            padding-top: 96px;
        }

        .registration-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 5vw, 2rem);
        }

        .registration-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: clamp(2rem, 5vw, 3rem);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .registration-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .registration-header h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .registration-header p {
            color: #6c757d;
            font-size: clamp(0.85rem, 2vw, 1rem);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #212529;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: clamp(0.6rem, 2vw, 0.75rem) 1rem;
            font-size: clamp(0.85rem, 2vw, 1rem);
            transition: all 200ms ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
            outline: none;
        }

        .form-control::placeholder {
            color: #adb5bd;
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #0d6efd;
            font-size: 1.2rem;
        }

        .input-group-relative {
            position: relative;
        }

        .btn-register {
            width: 100%;
            padding: clamp(0.6rem, 2vw, 0.75rem) 2rem;
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: clamp(0.85rem, 2vw, 1rem);
            transition: all 200ms ease;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.3);
            background: linear-gradient(135deg, #0a58ca 0%, #094299 100%);
            color: white;
            text-decoration: none;
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #6c757d;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
        }

        .login-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
            transition: color 200ms ease;
        }

        .login-link a:hover {
            color: #0a58ca;
            text-decoration: underline;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #0d6efd;
            font-size: 1.2rem;
            background: none;
            border: none;
            padding: 0;
        }

        .password-toggle:hover {
            color: #0a58ca;
        }

        @media (max-width: 575.98px) {
            .registration-card {
                max-width: 100%;
                padding: 1.5rem 1rem;
            }

            .registration-header h1 {
                margin-bottom: 0.25rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <script defer src="./component.js"></script>
    <script defer src="./app.js"></script>
    
    <navbar-component></navbar-component>

    <div class="registration-container">
        <div class="registration-card">
            <div class="registration-header">
                <h1>Create Account</h1>
                <p>Join NextDoorSA and start connecting</p>
            </div>

            <form id="registerForm">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="bi bi-person-fill"></i>
                        Username
                    </label>
                    <div class="input-group-relative">
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Choose your username"
                            required
                            minlength="3"
                            maxlength="20"
                        />
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope-fill"></i>
                        Email Address
                    </label>
                    <div class="input-group-relative">
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock-fill"></i>
                        Password
                    </label>
                    <div class="input-group-relative">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            required
                            minlength="8"
                        />
                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Toggle password visibility"
                        >
                            <i class="bi bi-eye-fill"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        <i class="bi bi-lock-fill"></i>
                        Confirm Password
                    </label>
                    <div class="input-group-relative">
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                            minlength="8"
                        />
                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                            aria-label="Toggle password visibility"
                        >
                            <i class="bi bi-eye-fill"></i>
                        </button>
                    </div>
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn-register">
                    <i class="bi bi-check-lg"></i> Create Account
                </button>

                <!-- Login Link -->
                <div class="login-link">
                    Already have an account? 
                    <a href="Home.html">Sign in here</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        togglePassword.addEventListener('click', function(e) {
            e.preventDefault();
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="bi bi-eye-fill"></i>' : '<i class="bi bi-eye-slash-fill"></i>';
        });

        toggleConfirmPassword.addEventListener('click', function(e) {
            e.preventDefault();
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="bi bi-eye-fill"></i>' : '<i class="bi bi-eye-slash-fill"></i>';
        });

        // Form validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            if (password.length < 8) {
                alert('Password must be at least 8 characters long!');
                return;
            }

            // If validation passes
            alert(`Welcome ${username}! Registration successful.`);
            // Here you would typically send the data to a backend server
        });
    </script>
</body>
</html>
