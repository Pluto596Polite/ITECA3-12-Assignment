<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script defer src="./app.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="./component.js"></script>
  </head>
  <body>
    <navbar-component></navbar-component>

    <div class="listing-form-container">
      <h1 class="mb-4">Create a Listing</h1>

      <!--this is where the image upload component will go-->
      <div class="mb-3 form-field-group">
        <label for="formFile" class="form-label">Upload an image:</label>
        <input
          class="form-control"
          type="file"
          id="formFile"
          accept="image/*"
        />
      </div>

      <!--this is where the input field for the title-->
      <div class="mb-3 form-field-group">
        <label for="titleInput" class="form-label">Title:</label>
        <input
          type="text"
          class="form-control"
          id="titleInput"
          placeholder="Enter the title of your listing"
        />
      </div>

      <!--this is where the input field for the description will go-->
      <div class="mb-3 form-field-group">
        <label for="descriptionInput" class="form-label">Description:</label>
        <textarea
          class="form-control"
          id="descriptionInput"
          rows="3"
          placeholder="Enter a description for your listing"
        ></textarea>
      </div>

      <!--this is where the input field for the price will go-->
      <div class="mb-5 form-field-group">
        <label for="priceInput" class="form-label">Price:</label>
        <input
          type="number"
          class="form-control"
          id="priceInput"
          placeholder="Enter the price of your listing"
        />
      </div>

      <div class="mb-3 form-field-group d-flex justify-content-center gap-3">
        <button
          class="btn btn-primary"
          id="submitListing"
          onclick="createListing()"
        >
          Submit Listing
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
