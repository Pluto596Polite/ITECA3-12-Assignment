<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create a Listing - NextDoorSA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css"/>
    <script type="module" src="./app.js"></script>
    <!-- <script defer src="./component.js"></script> -->
</head>
  <body>
    <app-navbar></app-navbar>

    <div class="listing-form-container">
      <div class="listing-card">
        <div class="listing-header">
          <h1>Create a Listing</h1>
          <p>Share your item with the community</p>
        </div>

        <form
                id="listingForm"´
                onsubmit="event.preventDefault(); createListing();">
          <!--this is where the input field for the title-->
          <div class="mb-3 form-field-group">
            <label for="titleInput" class="form-label">Title:</label>
            <input
              type="text"
              class="form-control"
              id="titleInput"
              placeholder="Enter the title of your listing"
            />
          </div>

          <!--this is where the input field for the description will go-->
          <div class="mb-3 form-field-group">
            <label for="descriptionInput" class="form-label">Description:</label>
            <textarea
              class="form-control"
              id="descriptionInput"
              rows="3"
              placeholder="Enter a description for your listing"
            ></textarea>
          </div>

          <!--this is where the input field for the price will go-->
          <div class="mb-3 form-field-group">
            <label for="priceInput" class="form-label">Price:</label>
            <input
              type="number"
              class="form-control"
              id="priceInput"
              placeholder="Enter the price of your listing"
            />
          </div>

          <!--this is where the image upload component will go-->
          <div class="mb-4 form-field-group">
            <label for="formFile" class="form-label">Upload an image:</label>
            <input
              class="form-control"
              type="file"
              id="formFile"
              accept="image/*"
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <button
              type="submit"
              class="btn-create-listing btn-primary"
              id="submitListing"
            >
              Submit Listing
            </button>
          </div>
        </form>
      </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
