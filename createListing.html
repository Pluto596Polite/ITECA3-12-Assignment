<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create a Listing - NextDoorSA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css"/>
    <script type="module" src="./app.js"></script>
    <!-- <script defer src="./component.js"></script> -->
</head>
<body>
<app-navbar></app-navbar>

<div class="listing-form-container">
    <div class="listing-card">
        <div class="listing-header">
            <h1>Create a Listing</h1>
            <p>Share your item with the community</p>
        </div>

        <form id="listingForm">
            <!--this is where the input field for the title-->
            <div class="mb-3 form-field-group">
                <label for="titleInput" class="form-label">Title:</label>
                <input
                        type="text"
                        class="form-control"
                        id="titleInput"
                        name="title"
                        placeholder="Enter the title of your listing"
                />
            </div>

            <!--this is where the input field for the description will go-->
            <div class="mb-3 form-field-group">
                <label for="descriptionInput" class="form-label">Description:</label>
                <textarea
                        class="form-control"
                        id="descriptionInput"
                        name="description"
                        rows="3"
                        placeholder="Enter a description for your listing"
                ></textarea>
            </div>

            <!--this is where the input field for the price will go-->
            <div class="mb-3 form-field-group">
                <label for="priceInput" class="form-label">Price:</label>
                <input
                        type="number"
                        class="form-control"
                        id="priceInput"
                        name="price"
                        placeholder="Enter the price of your listing"
                />
            </div>


            <div class="dropdwn-menu mb-3 form-field-group">
                <label for="listingType" class="form-label">Listing Type:</label>
                <select
                        class="form-select"
                        id="listingType"
                        name="listingType">
                    <option selected disabled value="">Select a listing type</option>
                    <option value="Outdoors">Outdoors</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Home">Home</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Services">Services</option>
                    <option value="Sports">Sports</option>
                </select>
            </div>

            <!--this is where the image upload component will go-->
            <div class="mb-4 form-field-group">
                <label for="imageInput" class="form-label">Upload an image:</label>
                <input
                        class="form-control"
                        type="file"
                        id="imageInput"
                        name="image"
                        accept="image/*"
                />
            </div>

            <div class="d-flex justify-content-center gap-3">
                <button
                        type="submit"
                        class="btn-create-listing btn-primary"
                        id="submitListing"
                >
                    Submit Listing
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="listingObject.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Load existing listings from localStorage so we don't overwrite them
        let listings = JSON.parse(localStorage.getItem('listings')) || [];

        const form = document.getElementById("listingForm");
        const imageInput = document.getElementById("imageInput");

        if (form) {
            form.addEventListener("submit", (e) => {
                e.preventDefault(); // Prevent page reload

                const listingID = "LIS-" + Date.now();
                const title = document.getElementById("titleInput").value;
                const description = document.getElementById("descriptionInput").value;
                const price = document.getElementById("priceInput").value;
                const category = document.getElementById("listingType").value;

                // Construct an image path (fake upload)
                let imagePath = "Assets/furniture.jpeg"; // Default
                if (imageInput && imageInput.files.length > 0) {
                     // In a real app, this would need server upload.
                     // Locally, we can only use a placeholder or the name if it matches something in Assets.
                     imagePath = "Assets/" + imageInput.files[0].name;
                }

                // Create the object.
                // We'll use a plain object for storage simplicity,
                // but we can also use the class if we handle serialization manually.
                const newListing = {
                    id: listingID,
                    title: title,
                    description: description,
                    price: price,
                    category: category,
                    image: imagePath // Saving image path too
                };

                listings.push(newListing);

                // Save to localStorage
                localStorage.setItem('listings', JSON.stringify(listings));

                console.log("Updated listings:", listings);
                alert("New listing successfully added!");

                form.reset();
            });
        }
    });
</script>
</body>
</html>
