<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - NextDoorSA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="./component.js"></script>
    <script defer src="./app.js"></script>
</head>
<body class="explore-page">
  <navbar-component></navbar-component>

    <button class="btn btn-primary d-lg-none m-2" id="toggle-sidebar" style="position: fixed; top: 70px; right: 10px; z-index: 1025;">
      <i class="bi bi-funnel"></i> Filters
    </button>

    <aside class="explore-sidebar" aria-label="Explore sidebar">
      <div class="d-flex justify-content-between align-items-center mb-3 d-lg-none">
        <h5 class="mb-0">Filters</h5>
        <button class="btn-close" id="close-sidebar"></button>
      </div>
      <h5 class="mb-3 d-none d-lg-block">Explore</h5>
      <p class="mb-3 text-sm">
        Filter items by category and find what you're looking for.
      </p>

<h5 class="mt-3 mb-2">Categories:</h5>
    <div id="category-filter" class="list-group list-group-flush">
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Technology">
        Technology
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Clothing">
        Clothing
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Appliances">
        Appliances
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Furniture">
        Furniture
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Cars">
        Cars
      </label>
      </div>
      

      <button class="btn btn-primary mt-3 w-100" type="button" onclick="applyFilters()" id="apply-filters-button">
        Apply Filters
      </button>
    </aside>

    <main class="explore-content">
      <h1>Explore</h1>
      <p>Browse items in your local area</p>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const toggleBtn = document.getElementById('toggle-sidebar');
  const sidebar = document.querySelector('.explore-sidebar');
  const closeBtn = document.getElementById('close-sidebar');

  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => sidebar.classList.add('show'));
    closeBtn.addEventListener('click', () => sidebar.classList.remove('show'));
    document.addEventListener('click', (e) => {
      if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
        sidebar.classList.remove('show');
      }
    });
  }
</script>

</body>
</html>
