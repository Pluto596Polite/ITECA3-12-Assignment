<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - NextDoorSA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="./app.js"></script>
</head>
<body class="explore-page">
<app-navbar></app-navbar>

    <button class="btn btn-primary d-lg-none" id="toggle-sidebar">
      <i class="bi bi-funnel"></i> Filters
    </button>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="explore-sidebar" aria-label="Explore sidebar">
      <div class="d-flex justify-content-between align-items-center mb-3 d-lg-none">
        <h5 class="mb-0">Filters</h5>
        <button class="btn-close" id="close-sidebar"></button>
      </div>
      <h5 class="mb-3 d-none d-lg-block mt-4">Explore</h5>
      <p class="mb-3 text-sm">
        Filter items by category and find what you're looking for.
      </p>

<h5 class="mt-3 mb-2">Categories:</h5>
    <div id="category-filter" class="list-group list-group-flush">
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Technology">
        Technology
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Clothing">
        Clothing
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Appliances">
        Appliances
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Furniture">
        Furniture
      </label>
      <label class="list-group-item d-flex gap-3 align-items-center border-0 py-2">
        <input class="form-check-input" type="checkbox" value="Cars">
        Cars
      </label>
      </div>
      

      <button class="btn btn-primary mt-3 w-100" type="button" onclick="applyFilters()" id="apply-filters-button">
        Apply Filters
      </button>
    </aside>

    <main class="explore-content">
      <h1>Explore</h1>
      <p>Browse items in your local area</p>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col">
          <product-card
            title="Mechanical Keyboard"
            image="Assets/keyboard.jpeg"
            description="High quality mechanical keyboard with RGB backlighting."
            link="#"
          ></product-card>
        </div>
        <div class="col">
          <product-card
            title="Men's Shirt"
            image="Assets/men's shirt.jpeg"
            description="Cotton men's shirt, size L. Barely worn."
            link="#"
          ></product-card>
        </div>
        <div class="col">
          <product-card
            title="Kitchen Blender"
            image="Assets/appliance.jpeg"
            description="Powerful kitchen blender, perfect for smoothies."
            link="#"
          ></product-card>
        </div>
        <div class="col">
          <product-card
            title="Living Room Sofa"
            image="Assets/furniture.jpeg"
            description="Comfortable 3-seater sofa. Grey upholstery."
            link="#"
          ></product-card>
        </div>
      </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const toggleBtn = document.getElementById('toggle-sidebar');
  const sidebar = document.querySelector('.explore-sidebar');
  const closeBtn = document.getElementById('close-sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');

  function openSidebar() {
    sidebar.classList.add('show');
    backdrop.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    sidebar.classList.remove('show');
    backdrop.classList.remove('show');
    document.body.style.overflow = '';
  }

  function toggleSidebar() {
    if (sidebar.classList.contains('show')) {
      closeSidebar();
    } else {
      openSidebar();
    }
  }

  if (toggleBtn) {
    toggleBtn.addEventListener('click', toggleSidebar);
    closeBtn.addEventListener('click', closeSidebar);
    backdrop.addEventListener('click', closeSidebar);
    
    // Close sidebar on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebar.classList.contains('show')) {
        closeSidebar();
      }
    });

    // Remove body scroll lock on desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 992) {
        document.body.style.overflow = '';
      }
    });
  }
</script>

</body>
</html>
